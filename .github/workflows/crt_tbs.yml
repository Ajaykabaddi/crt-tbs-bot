name: CRT TBS scan

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = scan now, backtest = send backtest report"
        default: "once"
        type: choice
        options: [once, backtest]

permissions:
  contents: write

concurrency:
  group: crt-tbs
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ccxt requests
      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TGTOKEN }}
          TG_CHAT_ID: ${{ secrets.TGCHATID }}
          EXCHANGE: okx
        run: python crt_tbs_bot.py ${{ github.event.inputs.mode || 'once' }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "update state" && git push)
